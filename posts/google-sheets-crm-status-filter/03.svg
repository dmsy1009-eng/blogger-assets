<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#ffffff"/>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08"/></filter></defs>
  <g font-family="Arial,'Noto Sans KR',sans-serif">
    <rect x="60" y="50" width="650" height="70" rx="24" fill="#eaf7ef"/>
    <rect x="78" y="62" width="46" height="46" rx="8" fill="#16a34a"/>
    <g stroke="#fff" stroke-width="4" fill="none"><rect x="89" y="74" width="24" height="23" rx="2"/><path d="M89 82h24M97 74v23M105 74v23"/></g>
    <text x="145" y="97" font-size="34" font-weight="700" fill="#0f6b45">Google Sheets CRM 실전 활용</text>
    <text x="60" y="205" font-size="62" font-weight="800" fill="#0f6b45">FILTER와 QUERY,</text>
    <text x="575" y="205" font-size="62" font-weight="800" fill="#111827">언제 무엇을 쓸까?</text>
    <text x="60" y="260" font-size="33" fill="#64748b">상담상태를 기준으로 고객을 자동 조회할 때의 선택 기준</text>

    <g filter="url(#shadow)">
      <rect x="48" y="330" width="720" height="425" rx="30" fill="#f7fbff"/>
      <circle cx="138" cy="405" r="48" fill="#3b82f6"/>
      <path d="M111 383h54l-20 25v28l-14 8v-36z" fill="none" stroke="#fff" stroke-width="7" stroke-linejoin="round"/>
      <text x="220" y="420" font-size="58" font-weight="800" fill="#2563eb">FILTER</text>
      <text x="220" y="466" font-size="28" fill="#334155">한 가지 조건으로 빠르게 추출할 때</text>
      <rect x="85" y="505" width="645" height="120" rx="22" fill="#ffffff" stroke="#cfe5ff" stroke-width="2"/>
      <text x="120" y="575" font-family="Consolas,monospace" font-size="31" fill="#0f172a">=FILTER(A2:AO, S2:S=&quot;신규문의&quot;)</text>
      <rect x="85" y="650" width="645" height="78" rx="22" fill="#eaf4ff"/>
      <circle cx="122" cy="677" r="14" fill="#3b82f6"/><path d="M116 677l5 5 9-11" fill="none" stroke="#fff" stroke-width="3"/>
      <text x="150" y="684" font-size="24" fill="#334155">단순하고 직관적</text>
      <circle cx="122" cy="708" r="14" fill="#3b82f6"/><path d="M116 708l5 5 9-11" fill="none" stroke="#fff" stroke-width="3"/>
      <text x="150" y="715" font-size="24" fill="#334155">특정 상태 전용 화면에 적합</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="832" y="330" width="720" height="425" rx="30" fill="#f7fcf8"/>
      <circle cx="922" cy="405" r="48" fill="#22c55e"/>
      <path d="M900 378h38l14 14v43h-52z" fill="none" stroke="#fff" stroke-width="6"/><path d="M938 378v17h14" fill="none" stroke="#fff" stroke-width="6"/>
      <text x="1000" y="420" font-size="58" font-weight="800" fill="#15803d">QUERY</text>
      <text x="1000" y="466" font-size="28" fill="#334155">열 선택·여러 조건·정렬까지 할 때</text>
      <rect x="870" y="505" width="645" height="120" rx="22" fill="#ffffff" stroke="#d9f0df" stroke-width="2"/>
      <text x="905" y="548" font-family="Consolas,monospace" font-size="26" fill="#0f172a">=QUERY(A:AO,</text>
      <text x="905" y="583" font-family="Consolas,monospace" font-size="26" fill="#0f172a">  &quot;select A,B,C,S where S='상담 진행'&quot;,</text>
      <text x="905" y="615" font-family="Consolas,monospace" font-size="26" fill="#0f172a">  1)</text>
      <rect x="870" y="650" width="645" height="78" rx="22" fill="#eefaf1"/>
      <circle cx="907" cy="677" r="14" fill="#22c55e"/><path d="M901 677l5 5 9-11" fill="none" stroke="#fff" stroke-width="3"/>
      <text x="935" y="684" font-size="24" fill="#334155">필요한 열만 노출</text>
      <circle cx="907" cy="708" r="14" fill="#22c55e"/><path d="M901 708l5 5 9-11" fill="none" stroke="#fff" stroke-width="3"/>
      <text x="935" y="715" font-size="24" fill="#334155">정렬·복수 조건 확장에 유리</text>
    </g>

    <rect x="48" y="790" width="1504" height="76" rx="24" fill="#edf7f0"/>
    <g transform="translate(80 806)" fill="#0f8a4b"><ellipse cx="20" cy="8" rx="17" ry="8"/><rect x="3" y="8" width="34" height="30"/><ellipse cx="20" cy="38" rx="17" ry="8"/></g>
    <line x1="136" y1="806" x2="136" y2="848" stroke="#b7d8c4" stroke-width="2"/>
    <text x="165" y="835" font-size="27" font-weight="700" fill="#0f6b45">운영 규칙이 우선:</text>
    <text x="385" y="835" font-size="27" fill="#334155">상태값은 드롭다운으로 표준화하고 변경 담당자·시점을 명확히 합니다.</text>
  </g>
</svg>