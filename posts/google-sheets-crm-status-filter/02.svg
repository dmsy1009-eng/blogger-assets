      <g font-size="20" fill="#334155" text-anchor="middle"><text x="141" y="520">08/25</text><text x="275" y="520">고객A</text><text x="415" y="520">010-****</text><text x="664" y="520">신규문의</text><text x="141" y="575">08/25</text><text x="275" y="575">고객B</text><text x="415" y="575">010-****</text><text x="664" y="575">상담 진행</text><text x="141" y="630">08/24</text><text x="275" y="630">고객C</text><text x="415" y="630">010-****</text><text x="664" y="630">견적 진행</text><text x="141" y="685">08/24</text><text x="275" y="685">고객D</text><text x="415" y="685">010-****</text><text x="664" y="685">종결</text></g>
