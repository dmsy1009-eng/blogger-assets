      <rect x="1040" y="690" width="466" height="38" rx="19" fill="#ffffff"/><circle cx="1064" cy="709" r="12" fill="#22c55e"/><path d="M1058 709l5 5 9-11" fill="none" stroke="#fff" stroke-width="3"/><text x="1086" y="716" font-size="18" fill="#475569">상태값만 바뀌면 조회 결과도 즉시 변경 · 고객 행 이동·복사 불필요</text>
