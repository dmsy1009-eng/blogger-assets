    <g transform="translate(80 803)" fill="#0f8a4b"><ellipse cx="20" cy="8" rx="17" ry="8"/><rect x="3" y="8" width="34" height="30"/><ellipse cx="20" cy="38" rx="17" ry="8"/></g>
    <line x1="136" y1="803" x2="136" y2="845" stroke="#b7d8c4" stroke-width="2"/>
    <text x="165" y="834" font-size="27" font-weight="700" fill="#0f6b45">핵심: 데이터의 Source of Truth는 한 곳에 유지하고, 조회만 자동화합니다.</text>
