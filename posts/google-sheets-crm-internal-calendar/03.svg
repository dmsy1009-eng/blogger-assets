<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f6f8fb"/><text x="90" y="105" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#172033">일정 데이터는 어떻게 캘린더로 이어질까?</text><rect x="90" y="180" width="250" height="150" rx="20" fill="#fff" stroke="#d8dee9"/><text x="215" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#344054">Google Sheets</text><text x="215" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#667085">V열 재연락일</text><text x="215" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#667085">W열 미팅일</text><rect x="90" y="370" width="250" height="110" rx="20" fill="#fff" stroke="#d8dee9"/><text x="215" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#344054">AP열 미팅시간</text><text x="215" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#667085">HH:mm</text><path d="M365 300H505" stroke="#98a2b3" stroke-width="5"/><path d="M493 289l22 11-22 11" fill="none" stroke="#98a2b3" stroke-width="5"/><rect x="525" y="220" width="250" height="180" rx="20" fill="#eef2ff"/><text x="650" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#344054">CRM 고객 객체</text><text x="650" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#667085">followUpDate</text><text x="650" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#667085">meetingDate</text><text x="650" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#667085">meetingTime</text><path d="M800 310H920" stroke="#98a2b3" stroke-width="5"/><path d="M908 299l22 11-22 11" fill="none" stroke="#98a2b3" stroke-width="5"/><rect x="940" y="205" width="180" height="215" rx="20" fill="#fff" stroke="#b8