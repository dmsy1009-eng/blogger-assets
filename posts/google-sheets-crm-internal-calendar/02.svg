<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f6f8fb"/><text x="90" y="110" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#172033">왜 CRM 내부 캘린더를 먼저 만들었을까?</text><rect x="90" y="160" width="470" height="390" rx="24" fill="#fff" stroke="#d8dee9"/><text x="130" y="220" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#344054">외부 캘린더로 분리</text><text x="130" y="278" font-family="Arial, sans-serif" font-size="22" fill="#667085">고객 상세 확인</text><text x="130" y="326" font-family="Arial, sans-serif" font-size="22" fill="#667085">→ 캘린더 앱 이동</text><text x="130" y="374" font-family="Arial, sans-serif" font-size="22" fill="#667085">→ 일정 검색</text><text x="130" y="422" font-family="Arial, sans-serif" font-size="22" fill="#667085">→ 다시 CRM 복귀</text><rect x="640" y="160" width="470" height="390" rx="24" fill="#fff" stroke="#b8c7f5" stroke-width="2"/><text x="680" y="220" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#344054">CRM 내부 캘린더</text><text x="680" y="278" font-family="Arial, sans-serif" font-size="22" fill="#667085">재연락일 확인</text><text x="680" y="326" font-family="Arial, sans-serif" font-size="22" fill="#667085">+ 미팅일·시간 확인</text><text x="680" y="374" font-family="Arial, sans-serif" font-size="22" fill="#667085">+ 고객 상세 바로 열기</text><text x="680" y="422" font-family="Arial, sans-serif" font-size="22" fill="#667085">= 화면 전환 최소화</text><rect x="680" y="465" width="320" height="52" rx="12" fill="#eef2ff"/><text x="840" y="499" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#3b5ccc">운영 흐름을 먼저 단순화</text><text x="90" y="610" font-family="Arial, sans-serif" font-size="24" fill="#475467">외부 연동보다 실제 사용 흐름이 먼저였습니다.</text></svg>