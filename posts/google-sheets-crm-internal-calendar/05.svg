<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f6f8fb"/><text x="90" y="110" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#172033">상담 기록이 바로 일정 관리로 이어지는 흐름</text><g font-family="Arial, sans-serif"><rect x="90" y="220" width="190" height="130" rx="20" fill="#fff" stroke="#d8dee9"/><text x="185" y="270" text-anchor="middle" font-size="23" font-weight="700" fill="#344054">고객 상담</text><text x="185" y="310" text-anchor="middle" font-size="18" fill="#667085">다음 일정 확정</text><path d="M300 285H390" stroke="#98a2b3" stroke-width="5"/><path d="M380 275l20 10-20 10" fill="none" stroke="#98a2b3" stroke-width="5"/><rect x="410" y="220" width="210" height="130" rx="20" fill="#eef2ff"/><text x="515" y="265" text-anchor="middle" font-size="22" font-weight="700" fill="#344054">CRM 저장</text><text x="515" y="300" text-anchor="middle" font-size="17" fill="#667085">재연락일</text><text x="515" y="326" text-anchor="middle" font-size="17" fill="#667085">미팅일 + 시간</text><path d="M640 285H730" stroke="#98a2b3" stroke-width="5"/><path d="M720 275l20 10-20 10" fill="none" stroke="#98a2b3" stroke-width="5"/><rect x="750" y="220" width="210" height="130" rx="20" fill="#f3ecff"/><text x="855" y="265" text-anchor="middle" font-size="22" font-weight="700" fill="#344054">월간 캘린더</text><text x="855" y="300" text-anchor="middle" font-size="17" fill="#667085">일정 시각화</text><text x="855" y="326" text-anchor="middle" font-size="17" fill="#667085">날짜별 아젠다</text><path d="M980 285H1055" stroke="#98a2b3" stroke-width="5"/><path d="M1045 275l20 10-20 10" fill="none" stroke="#98a2b3" stroke-width="5"/><rect x="1045" y="220" width="95" height="130" rx="20" fill="#fff7ed"/><text x="1092" y="270" text-anchor="middle" font-size="19" font-weight="700" fill="#344054">고객</text><text x="1092" y="298" text-anchor="middle" font-size="19" font-weight="700" fill="#344054">상세</text><text x="1092" y="327" text-anchor="middle" font-size="15" fill="#667085">바로 열기</text><rect x="170" y="430" width="860" height="95" rx="18" fill="#fff" stroke="#d8dee9"/><text x="600" y="470" text-anchor="middle" font-size="23" font-weight="700" fill="#344054">핵심은 달력 자체가 아니라 데이터 연결입니다.</text><text x="600" y="505" text-anchor="middle" font-size="19" fill="#667085">상담 → 일정 저장 → 확인 → 고객 상세 → 후속 처리까지 한 흐름으로 이어집니다.</text></g></svg>