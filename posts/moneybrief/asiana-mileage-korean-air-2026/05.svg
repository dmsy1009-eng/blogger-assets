<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#eef3f7"/></linearGradient></defs><rect width="1200" height="675" fill="url(#bg)"/><text x="55" y="58" fill="#17344f" font-family="Arial,'Noto Sans KR',sans-serif" font-size="24" font-weight="700">MONEY BRIEF</text><text x="600" y="118" text-anchor="middle" fill="#102b45" font-family="Arial,'Noto Sans KR',sans-serif" font-size="56" font-weight="900">지금 확인할 4가지</text><text x="600" y="160" text-anchor="middle" fill="#627589" font-family="Arial,'Noto Sans KR',sans-serif" font-size="24">전환보다 먼저 내 마일리지 사용계획을 확인하세요.</text><g transform="translate(95 215)"><rect width="1010" height="76" rx="22" fill="#fff" stroke="#d4e0eb" stroke-width="2"/><circle cx="48" cy="38" r="24" fill="#2368ad"/><text x="48" y="47" text-anchor="middle" fill="#fff" font-family="Arial" font-size="26" font-weight="900">1</text><text x="95" y="48" fill="#1c3b57" font-family="Arial,'Noto Sans KR',sans-serif" font-size="29" font-weight="700">내 마일리지는 탑승 적립 중심인가?</text></g><g transform="translate(95 310)"><rect width="1010" height="76" rx="22" fill="#fff" stroke="#d4e0eb" stroke-width="2"/><circle cx="48" cy="38" r="24" fill="#e3646d"/><text x="48" y="47" text-anchor="middle" fill="#fff" font-family="Arial" font-size="26" font-weight="900">2</text><text x="95" y="48" fill="#1c3b57" font-family="Arial,'Noto Sans KR',sans-serif" font-size="29" font-weight="700">카드·호텔 등 제휴 사용 비중이 큰가?</text></g><g transform="translate(95 405)"><rect width="1010" height="76" rx="22" fill="#fff" stroke="#d4e0eb" stroke-width="2"/><circle cx="48" cy="38" r="24" fill="#2368ad"/><text x="48" y="47" text-anchor="middle" fill="#fff" font-family="Arial" font-size="26" font-weight="900">3</text><text x="95" y="48" fill="#1c3b57" font-family="Arial,'Noto Sans KR',sans-serif" font-size="29" font-weight="700">가까운 시기에 실제 사용할 계획이 있는가?</text></g><g transform="translate(95 500)"><rect width="1010" height="76" rx="22" fill="#fff" stroke="#d4e0eb" stroke-width="2"/><circle cx="48" cy="38" r="24" fill="#e6a82c"/><text x="48" y="47" text-anchor="middle" fill="#fff" font-family="Arial" font-size="26" font-weight="900">4</text><text x="95" y="48" fill="#1c3b57" font-family="Arial,'Noto Sans KR',sans-serif" font-size="29" font-weight="700">10년 유지와 대한항공 전환 중 어느 쪽이 계획에 맞는가?</text></g><rect x="250" y="604" width="700" height="52" rx="18" fill="#0d365d"/><text x="600" y="638" text-anchor="middle" fill="#fff" font-family="Arial,'Noto Sans KR',sans-serif" font-size="25" font-weight="700">핵심: 무조건 전환보다 ‘어떻게 쓸지’가 먼저</text></svg>