<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#eef7ff"/><stop offset="1" stop-color="#fffaf0"/></linearGradient></defs><rect width="1200" height="675" fill="url(#bg)"/><text x="55" y="58" fill="#17344f" font-family="Arial,'Noto Sans KR',sans-serif" font-size="24" font-weight="700">MONEY BRIEF</text><text x="600" y="120" text-anchor="middle" fill="#102b45" font-family="Arial,'Noto Sans KR',sans-serif" font-size="54" font-weight="900">10만 마일이면 어떻게 될까?</text><text x="600" y="165" text-anchor="middle" fill="#536b80" font-family="Arial,'Noto Sans KR',sans-serif" font-size="24">같은 10만 마일도 적립 유형에 따라 전환 수량이 달라집니다.</text><g transform="translate(95 220)"><rect width="465" height="330" rx="28" fill="#fff" stroke="#2e75ba" stroke-width="5"/><rect width="465" height="78" rx="28" fill="#2368ad"/><rect y="50" width="465" height="28" fill="#2368ad"/><text x="232" y="51" text-anchor="middle" fill="#fff" font-family="Arial,'Noto Sans KR',sans-serif" font-size="30" font-weight="800">탑승 마일리지</text><text x="80" y="200" fill="#153958" font-family="Arial,'Noto Sans KR',sans-serif" font-size="58" font-weight="900">10만</text><text x="230" y="202" fill="#68a6df" font-family="Arial" font-size="62" font-weight="900">→</text><text x="315" y="200" fill="#153958" font-family="Arial,'Noto Sans KR',sans-serif" font-size="58" font-weight="900">10만</text><text x="232" y="272" text-anchor="middle" fill="#2368ad" font-family="Arial,'Noto Sans KR',sans-serif" font-size="30" font-weight="800">1:1 전환</text></g><g transform="translate(640 220)"><rect width="465" height="330" rx="28" fill="#fff" stroke="#e3646d" stroke-width="5"/><rect width="465" height="78" rx="28" fill="#dc5560"/><rect y="50" width="465" height="28" fill="#dc5560"/><text x="232" y="51" text-anchor="middle" fill="#fff" font-family="Arial,'Noto Sans KR',sans-serif" font-size="30" font-weight="800">제휴 마일리지</text><text x="72" y="200" fill="#153958" font-family="Arial,'Noto Sans KR',sans-serif" font-size="58" font-weight="900">10만</text><text x="215" y="202" fill="#e9989d" font-family="Arial" font-size="62" font-weight="900">→</text><text x="295" y="200" fill="#153958" font-family="Arial,'Noto Sans KR',sans-serif" font-size="58" font-weight="900">8.2만</text><text x="232" y="272" text-anchor="middle" fill="#dc5560" font-family="Arial,'Noto Sans KR',sans-serif" font-size="30" font-weight="800">1:0.82 전환</text></g><text x="600" y="615" text-anchor="middle" fill="#526b80" font-family="Arial,'Noto Sans KR',sans-serif" font-size="22">※ 마일리지 수량 예시이며 실제 항공권 이용가치와 동일한 개념은 아닙니다.</text></svg>