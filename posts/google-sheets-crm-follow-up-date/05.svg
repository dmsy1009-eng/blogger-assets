<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f8fafc"/><text x="70" y="90" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#172033">메모 중심 관리에서 일정 중심 관리로</text><rect x="80" y="150" width="470" height="430" rx="24" fill="white" stroke="#d0d5dd"/><text x="315" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#344054">기존 방식</text><text x="130" y="280" font-family="Arial, sans-serif" font-size="23" fill="#667085">• 상담메모에서 다음 연락 시점 확인</text><text x="130" y="340" font-family="Arial, sans-serif" font-size="23" fill="#667085">• 담당자가 직접 기억하거나 검색</text><text x="130" y="400" font-family="Arial, sans-serif" font-size="23" fill="#667085">• 업무량이 늘면 우선순위 파악 어려움</text><text x="130" y="460" font-family="Arial, sans-serif" font-size="23" fill="#667085">• 연락 후 다음 일정 다시 수동 판단</text><path d="M575 365H625" stroke="#98a2b3" stroke-width="6"/><path d="M615 353l24 12-24 12" fill="none" stroke="#98a2b3" stroke-width="6"/><rect x="650" y="150" width="470" height="430" rx="24" fill="white" stroke="#d0d5dd"/><text x="885" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#344054">재연락일 적용</text><text x="700" y="280" font-family="Arial, sans-serif" font-size="23" fill="#027a48">• 재연락일을 별도 날짜 필드로 저장</text><text x="700" y="340" font-family="Arial, sans-serif" font-size="23" fill="#027a48">• 오늘 연락 대상만 바로 확인</text><text x="700" y="400" font-family="Arial, sans-serif" font-size="23" fill="#027a48">• 상태와 날짜를 함께 업무 기준으로 사용</text><text x="700" y="460" font-family="Arial, sans-serif" font-size="23" fill="#027a48">• 처리 후 다음 액션을 즉시 갱신</text></svg>