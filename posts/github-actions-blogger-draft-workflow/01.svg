<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
<rect width="1440" height="900" fill="#F6F8FB"/>
<rect x="44" y="44" width="1352" height="812" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2"/>
<style>
.title{font-family:NanumSquare, Arial, sans-serif;font-weight:800;fill:#172033}
.h2{font-family:NanumSquare, Arial, sans-serif;font-weight:700;fill:#1F2937}
.body{font-family:NanumSquare, Arial, sans-serif;font-weight:500;fill:#475569}
.small{font-family:NanumSquare, Arial, sans-serif;font-weight:500;fill:#64748B}
.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-weight:600;fill:#334155}
</style>
<text x="100" y="145" class="small" font-size="22">업무자동화 실험실 · 9번째 글</text>
<text x="100" y="225" class="title" font-size="54">Blogger 자동발행은</text>
<text x="100" y="292" class="title" font-size="54">DRAFT부터 시작합니다</text>
<text x="100" y="350" class="body" font-size="24">GitHub Actions로 초안 생성 → 검수 → 승인 → 공개발행</text>
<rect x="100" y="430" width="220" height="126" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="210" y="478" text-anchor="middle" class="h2" font-size="22">Markdown</text>
<text x="210" y="514" text-anchor="middle" class="small" font-size="17">원고 + 메타데이터</text>
<line x1="320" y1="493" x2="380" y2="493" stroke="#94A3B8" stroke-width="4"/><polygon points="380,493 365,485 365,501" fill="#94A3B8"/>
<rect x="390" y="430" width="220" height="126" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
<text x="500" y="478" text-anchor="middle" class="h2" font-size="22">GitHub Actions</text>
<text x="500" y="514" text-anchor="middle" class="small" font-size="17">자산검증 · 정규화</text>
<line x1="610" y1="493" x2="670" y2="493" stroke="#94A3B8" stroke-width="4"/><polygon points="670,493 655,485 655,501" fill="#94A3B8"/>
<rect x="680" y="430" width="220" height="126" rx="18" fill="#EEF6FF" stroke="#93C5FD" stroke-width="2"/>
<text x="790" y="478" text-anchor="middle" class="h2" font-size="22">Blogger DRAFT</text>
<text x="790" y="514" text-anchor="middle" class="small" font-size="17">본문 · 이미지 확인</text>
<line x1="900" y1="493" x2="960" y2="493" stroke="#94A3B8" stroke-width="4"/><polygon points="960,493 945,485 945,501" fill="#94A3B8"/>
<rect x="970" y="430" width="220" height="126" rx="18" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2"/>
<text x="1080" y="478" text-anchor="middle" class="h2" font-size="22">사용자 승인</text>
<text x="1080" y="514" text-anchor="middle" class="small" font-size="17">PUBLISH Gate</text>
<rect x="100" y="650" width="1090" height="110" rx="18" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="130" y="696" class="h2" font-size="22">핵심 원칙</text>
<text x="130" y="735" class="body" font-size="20">자동화는 “바로 공개”가 아니라 “검수 가능한 초안”을 만드는 데 먼저 사용합니다.</text>
