<rect x="100" y="620" width="1140" height="130" rx="18" fill="#FFF7ED" stroke="#FED7AA"/><text x="140" y="672" class="h2" font-size="23">승인값이 없거나 다르면?</text><text x="140" y="716" class="body" font-size="20">공개발행을 진행하지 않고 안전 종료합니다. DRAFT와 공개발행을 같은 자동화 단계로 묶지 않습니다.</text>
