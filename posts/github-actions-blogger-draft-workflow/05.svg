<style>.title{font-family:NanumSquare,Arial,sans-serif;font-weight:800;fill:#172033}.h2{font-family:NanumSquare,Arial,sans-serif;font-weight:700;fill:#1F2937}.body{font-family:NanumSquare,Arial,sans-serif;font-weight:500;fill:#475569}.small{font-family:NanumSquare,Arial,sans-serif;font-weight:500;fill:#64748B}</style>
<text x="100" y="145" class="small" font-size="22">공개발행 안전장치</text><text x="100" y="205" class="title" font-size="42">PUBLISH는 승인값이 정확히 있을 때만 실행됩니다</text>
<rect x="100" y="300" width="520" height="230" rx="20" fill="#0F172A"/><text x="140" y="355" class="small" font-size="18" fill="#CBD5E1">queue/blogger-publish.txt</text><text x="140" y="410" font-family="Consolas,monospace" font-size="20" font-weight="600" fill="#F8FAFC">posts/article.md</text><text x="140" y="462" font-family="Consolas,monospace" font-size="24" font-weight="800" fill="#86EFAC">PUBLISH</text>
<rect x="790" y="300" width="450" height="230" rx="20" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2"/><text x="1015" y="365" text-anchor="middle" class="h2" font-size="27">승인값 확인</text><text x="1015" y="416" text-anchor="middle" class="body" font-size="20">정확히 PUBLISH</text><text x="1015" y="464" text-anchor="middle" class="h2" font-size="24">→ 공개발행 실행</text>
