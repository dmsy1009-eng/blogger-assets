<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
<rect width="1440" height="900" fill="#F6F8FB"/><rect x="44" y="44" width="1352" height="812" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2"/>
<style>.title{font-family:NanumSquare,Arial,sans-serif;font-weight:800;fill:#172033}.h2{font-family:NanumSquare,Arial,sans-serif;font-weight:700;fill:#1F2937}.body{font-family:NanumSquare,Arial,sans-serif;font-weight:500;fill:#475569}.small{font-family:NanumSquare,Arial,sans-serif;font-weight:500;fill:#64748B}</style>
<text x="100" y="145" class="small" font-size="22">운영 방식 비교</text><text x="100" y="205" class="title" font-size="42">바로 공개보다 DRAFT Gate가 안전합니다</text>
<rect x="100" y="285" width="530" height="390" rx="22" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/><text x="140" y="345" class="h2" font-size="28">바로 공개</text><rect x="140" y="390" width="450" height="58" rx="12" fill="#FFFFFF" stroke="#FED7AA"/><text x="365" y="427" text-anchor="middle" class="body" font-size="19">원고 작성 → 즉시 PUBLISH</text><text x="150" y="505" class="body" font-size="19">• 이미지 누락을 공개 후 발견</text><text x="150" y="548" class="body" font-size="19">• Markdown 잔여문구 노출 가능</text><text x="150" y="591" class="body" font-size="19">• 잘못된 제목·표 구조 확인이 늦음</text>
<rect x="710" y="285" width="530" height="390" rx="22" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2"/><text x="750" y="345" class="h2" font-size="28">DRAFT 먼저</text><rect x="750" y="390" width="450" height="58" rx="12" fill="#FFFFFF" stroke="#BBF7D0"/><text x="975" y="427" text-anchor="middle" class="body" font-size="19">원고 → DRAFT → Audit → 승인</text><text x="760" y="505" class="body" font-size="19">• 이미지 URL 존재 여부 사전검사</text><text x="760" y="548" class="body" font-size="19">• 본문 길이·표·자리표시 검증</text><text x="760" y="591" class="body" font-size="19">• 승인 전에는 공개발행 차단</text>
<rect x="100" y="735" width="1140" height="70" rx="14" fill="#EEF6FF"/><text x="670" y="779" text-anchor="middle" class="h2" font-size="21">자동화의 목적은 검수를 없애는 것이 아니라, 검수 전에 반복오류를 먼저 제거하는 것입니다.</text>
</svg>