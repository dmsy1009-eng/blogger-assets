<line x1="400" y1="375" x2="480" y2="375" stroke="#94A3B8" stroke-width="4"/><polygon points="480,375 465,367 465,383" fill="#94A3B8"/><line x1="800" y1="375" x2="880" y2="375" stroke="#94A3B8" stroke-width="4"/><polygon points="880,375 865,367 865,383" fill="#94A3B8"/>
<rect x="100" y="560" width="1100" height="170" rx="18" fill="#F8FAFC" stroke="#E2E8F0"/><text x="135" y="610" class="h2" font-size="23">왜 Queue 파일을 따로 둘까?</text><text x="135" y="650" class="body" font-size="19">원고 수정과 실행 트리거를 분리하면, 어떤 글을 다시 DRAFT로 보낼지 명확하게 통제할 수 있습니다.</text><text x="135" y="690" class="body" font-size="19">원고 전체를 건드리지 않고 Queue 한 줄만 바꿔 재검증할 수 있습니다.</text>
