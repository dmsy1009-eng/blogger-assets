<rect width="1440" height="900" fill="#F6F8FB"/><rect x="44" y="44" width="1352" height="812" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2"/>
<style>.title{font-family:NanumSquare,Arial,sans-serif;font-weight:800;fill:#172033}.h2{font-family:NanumSquare,Arial,sans-serif;font-weight:700;fill:#1F2937}.body{font-family:NanumSquare,Arial,sans-serif;font-weight:500;fill:#475569}.small{font-family:NanumSquare,Arial,sans-serif;font-weight:500;fill:#64748B}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-weight:600;fill:#334155}</style>
<text x="100" y="145" class="small" font-size="22">전체 파이프라인</text><text x="100" y="205" class="title" font-size="42">원고와 실행신호를 분리하면 운영이 단순해집니다</text>
<rect x="100" y="285" width="300" height="180" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/><text x="130" y="335" class="h2" font-size="24">1. 원고 저장</text><text x="130" y="378" class="mono" font-size="18">posts/article.md</text><text x="130" y="417" class="body" font-size="18">제목 · 라벨 · 이미지 URL</text>
<rect x="500" y="285" width="300" height="180" rx="18" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/><text x="530" y="335" class="h2" font-size="24">2. Queue 변경</text><text x="530" y="378" class="mono" font-size="18">queue/blogger-draft.txt</text><text x="530" y="417" class="body" font-size="18">첫 줄에 원고 경로 기록</text>
