<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f7f7f5"/><text x="70" y="80" font-family="Noto Sans KR,Arial,sans-serif" font-size="34" font-weight="700" fill="#202020">장기 미처리 고객 판정 로직</text><g font-family="Noto Sans KR,Arial,sans-serif" text-anchor="middle"><rect x="90" y="160" width="220" height="88" fill="#fff" stroke="#454545"/><text x="200" y="195" font-size="21" fill="#222">CRM_ACTIVITY</text><text x="200" y="226" font-size="18" fill="#555">문의ID별 마지막 활동일</text><line x1="310" y1="204" x2="390" y2="204" stroke="#444" stroke-width="2"/><polygon points="390,204 378,197 378,211" fill="#444"/><rect x="390" y="160" width="220" height="88" fill="#fff" stroke="#454545"/><text x="500" y="194" font-size="20" fill="#222">TODAY()와 비교</text><text x="500" y="226" font-size="18" fill="#555">경과일 계산</text><line x1="610" y1="204" x2="690" y2="204" stroke="#444" stroke-width="2"/><polygon points="690,204 678,197 678,211" fill="#444"/><rect x="690" y="150" width="220" height="108" fill="#fff" stroke="#454545"/><text x="800" y="192" font-size="20" fill="#222">7일 이상인가?</text><text x="800" y="224" font-size="17" fill="#666">계약완료·종결 제외</text><line x1="910" y1="204" x2="1000" y2="204" stroke="#444" stroke-width="2"/><polygon points="1000,204 988,197 988,211" fill="#444"/><rect x="1000" y="160" width="130" height="88" fill="#222"/><text x="1065" y="197" font-size="19" fill="#fff">확인 필요</text><text x="1065" y="225" font-size="16" fill="#ddd">우선 검토</text><line x1="800" y1="258" x2="800" y2="355" stroke="#777" stroke-width="2"/><polygon points="800,355 793,343 807,343" fill="#777"/><text x="828" y="315" font-size="17" text-anchor="start" fill="#666">7일 미만</text><rect x="690" y="355" width="220" height="82" fill="#e9ecef"/><text x="800" y="405" font-size="20" fill="#333">정상 관리</text></g><rect x="90" y="500" width="1040" height="105" fill="#fff" stroke="#d1d1cd"/><text x="120" y="540" font-family="Noto Sans KR,Arial,sans-serif" font-size="20" fill="#555">판정식의 기준일은 7일로 고정할 필요가 없습니다.</text><text x="120" y="575" font-family="Noto Sans KR,Arial,sans-serif" font-size="23" font-weight="700" fill="#222">상담 단계별 기준을 정하고, 그 기준을 시트 계산식에 명시하는 것이 핵심입니다.</text></svg>