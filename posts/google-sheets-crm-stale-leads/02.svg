<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#ffffff"/><text x="70" y="85" font-family="Noto Sans KR,Arial,sans-serif" font-size="38" font-weight="700" fill="#222">상태만 보면 오래 멈춘 고객이 보이지 않습니다</text><text x="70" y="128" font-family="Noto Sans KR,Arial,sans-serif" font-size="21" fill="#666">실제 운영표처럼 필요한 열만 놓고 보면 문제 지점이 더 분명해집니다.</text><rect x="70" y="175" width="1060" height="390" fill="#fff" stroke="#cfd4da"/><rect x="70" y="175" width="1060" height="62" fill="#f1f3f5"/><g font-family="Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" fill="#333"><text x="100" y="215">고객</text><text x="305" y="215">상태</text><text x="565" y="215">마지막 활동</text><text x="825" y="215">경과일</text><text x="1000" y="215">관리</text></g><g stroke="#e1e4e8"><line x1="70" y1="237" x2="1130" y2="237"/><line x1="70" y1="319" x2="1130" y2="319"/><line x1="70" y1="401" x2="1130" y2="401"/><line x1="70" y1="483" x2="1130" y2="483"/></g><rect x="71" y="320" width="1058" height="81" fill="#fff7ed"/><rect x="71" y="402" width="1058" height="80" fill="#fff7ed"/><g font-family="Noto Sans KR,Arial,sans-serif" font-size="23" fill="#333"><text x="100" y="288">김OO</text><text x="305" y="288">1차상담</text><text x="565" y="288">09/02</text><text x="825" y="288">2일</text><text x="1000" y="288">정상</text><text x="100" y="370">이OO</text><text x="305" y="370">견적진행</text><text x="565" y="370">08/26</text><text x="825" y="370">9일</text><text x="1000" y="370" font-weight="700" fill="#9a3412">확인 필요</text><text x="100" y="452">박OO</text><text x="305" y="452">현장미팅</text><text x="565" y="452">08/21</text><text x="825" y="452">14일</text><text x="1000" y="452" font-weight="700" fill="#9a3412">확인 필요</text><text x="100" y="534">최OO</text><text x="305" y="534">계약완료</text><text x="565" y="534">08/19</text><text x="825" y="534">16일</text><text x="1000" y="534" fill="#777">제외</text></g><text x="70" y="625" font-family="Noto Sans KR,Arial,sans-serif" font-size="24" fill="#444">핵심은 상태값이 아니라 “현재 상태 + 마지막 실제 활동일”을 함께 보는 것입니다.</text></svg>