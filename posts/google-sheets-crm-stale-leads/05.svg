<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#fbfbfa"/><text x="70" y="78" font-family="Noto Sans KR,Arial,sans-serif" font-size="36" font-weight="700" fill="#222">업무 흐름은 이렇게 바뀝니다</text><line x1="600" y1="120" x2="600" y2="575" stroke="#c9c9c4"/><text x="210" y="150" font-family="Noto Sans KR,Arial,sans-serif" font-size="24" font-weight="700" fill="#666">기존</text><text x="810" y="150" font-family="Noto Sans KR,Arial,sans-serif" font-size="24" font-weight="700" fill="#222">개선 후</text><g font-family="Noto Sans KR,Arial,sans-serif" text-anchor="middle"><rect x="115" y="200" width="330" height="72" fill="#f1f1ef"/><text x="280" y="244" font-size="22" fill="#555">전체 고객 목록 확인</text><line x1="280" y1="272" x2="280" y2="325" stroke="#888" stroke-width="2"/><polygon points="280,325 272,312 288,312" fill="#888"/><rect x="115" y="325" width="330" height="72" fill="#f1f1ef"/><text x="280" y="369" font-size="22" fill="#555">메모와 날짜를 수동 비교</text><line x1="280" y1="397" x2="280" y2="450" stroke="#888" stroke-width="2"/><polygon points="280,450 272,437 288,437" fill="#888"/><rect x="115" y="450" width="330" height="72" fill="#eee8e5"/><text x="280" y="494" font-size="22" fill="#7b4b3c">누락 가능</text><rect x="755" y="200" width="330" height="72" fill="#fff" stroke="#444"/><text x="920" y="244" font-size="22" fill="#222">마지막 활동일 자동 집계</text><line x1="920" y1="272" x2="920" y2="325" stroke="#444" stroke-width="2"/><polygon points="920,325 912,312 928,312" fill="#444"/><rect x="755" y="325" width="330" height="72" fill="#fff" stroke="#444"/><text x="920" y="359" font-size="21" fill="#222">장기 미처리 자동 표시</text><text x="920" y="384" font-size="16" fill="#666">상태 + 경과일 기준</text><line x1="920" y1="397" x2="920" y2="450" stroke="#444" stroke-width="2"/><polygon points="920,450 912,437 928,437" fill="#444"/><rect x="755" y="450" width="330" height="72" fill="#222"/><text x="920" y="494" font-size="22" fill="#fff">확인 대상부터 처리</text></g><rect x="70" y="585" width="1060" height="48" fill="#f0f0ed"/><text x="600" y="617" text-anchor="middle" font-family="Noto Sans KR,Arial,sans-serif" font-size="23" font-weight="700" fill="#333">고객 수가 늘어날수록 기억보다 관리기준이 중요합니다.</text></svg>