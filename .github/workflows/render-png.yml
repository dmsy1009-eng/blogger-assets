name: Render Blogger PNG assets

on:
  push:
    branches: [main]
    paths:
      - 'sources/**/*.svg'
      - '.github/workflows/render-png.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blogger-assets-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SVG renderer and Korean fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin fonts-noto-cjk

      - name: Render all SVG assets to PNG
        shell: bash
        run: |
          set -euo pipefail
          count=0

          while IFS= read -r -d '' svg; do
            rel="${svg#sources/}"
            slug="${rel%/*}"
            filename="${rel##*/}"
            stem="${filename%.svg}"
            out_dir="posts/$slug"
            out_file="$out_dir/$stem.png"

            mkdir -p "$out_dir"
            echo "Render: $svg -> $out_file"
            rsvg-convert -w 1200 -h 675 "$svg" -o "$out_file"
            count=$((count + 1))
          done < <(find sources -type f -name '*.svg' -print0 | sort -z)

          if [ "$count" -eq 0 ]; then
            echo 'No SVG assets found.'
            exit 1
          fi

          echo "Rendered SVG count: $count"

      - name: Commit rendered PNG files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add posts

          if git diff --cached --quiet; then
            echo 'No PNG changes to commit.'
            exit 0
          fi

          git commit -m 'Render Blogger PNG assets'
          git push
