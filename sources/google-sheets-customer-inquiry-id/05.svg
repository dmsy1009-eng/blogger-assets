<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675"><rect width="1200" height="675" fill="#f8fafc"/><style>text{font-family:'Noto Sans CJK KR','Malgun Gothic',sans-serif;fill:#1f2937}.t{font-size:38px;font-weight:700}.s{font-size:20px;fill:#64748b}.h{font-size:20px;font-weight:700}.c{font-size:20px;font-family:monospace}</style><text x="60" y="80" class="t">Apps Script로 고객ID 자동 생성</text><text x="62" y="116" class="s">한 번 생성한 ID를 고정값으로 저장</text><rect x="70" y="170" width="690" height="395" rx="20" fill="#1f2531"/><g class="c"><text x="105" y="220" fill="#d7e1eb">function createCustomerId() {</text><text x="105" y="267" fill="#b4d791">  const lastRow = sheet.getLastRow();</text><text x="105" y="314" fill="#edbd6b">  if (currentId) return;</text><text x="105" y="361" fill="#d7e1eb">  const customerId =</text><text x="105" y="408" fill="#82cdb0">    'C-' + formatDate(new Date());</text><text x="105" y="455" fill="#d7e1eb">  sheet.getRange(...).setValue(customerId);</text><text x="105" y="502" fill="#d7e1eb">}</text></g><rect x="815" y="200" width="295" height="110" rx="18" fill="#fff" stroke="#d6e0e9" stroke-width="2"/><text x="850" y="234" class="h" fill="#64748b">생성 예시</text><text x="850" y="278" style="font-family:'Noto Sans CJK KR','Malgun Gothic';font-size:19px;font-weight:700;fill:#10966e">C-20260817213015</text><rect x="815" y="350" width="295" height="150" rx="18" fill="#e8f4ef"/><text x="850" y="385" class="h" fill="#10966e">장점</text><text x="850" y="430" style="font-family:'Noto Sans CJK KR','Malgun Gothic';font-size:20px">• 정렬해도 유지</text><text x="850" y="470" style="font-family:'Noto Sans CJK KR','Malgun Gothic';font-size:20px">• 행 번호와 무관</text><text x="60" y="640" class="s">workautomationlab · CRM 자동화</text></svg>