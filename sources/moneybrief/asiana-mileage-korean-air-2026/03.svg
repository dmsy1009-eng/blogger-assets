<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><defs><linearGradient id="bg" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#f5fbff"/><stop offset="1" stop-color="#e7f1f8"/></linearGradient></defs><rect width="1200" height="675" fill="url(#bg)"/><text x="55" y="58" fill="#17344f" font-family="Arial,'Noto Sans KR',sans-serif" font-size="24" font-weight="700">MONEY BRIEF</text><text x="600" y="115" text-anchor="middle" fill="#102b45" font-family="Arial,'Noto Sans KR',sans-serif" font-size="52" font-weight="900">통합 후, 어떻게 이용하나요?</text><text x="600" y="158" text-anchor="middle" fill="#536b80" font-family="Arial,'Noto Sans KR',sans-serif" font-size="24">지금 당장 선택하는 것이 아니라 통합 이후 적용되는 이용 방식입니다.</text><g transform="translate(80 225)"><rect width="450" height="310" rx="30" fill="#0d4e88"/><rect x="40" y="38" width="130" height="78" rx="16" fill="#edf3f8"/><text x="105" y="88" text-anchor="middle" fill="#334d66" font-size="28" font-weight="800" font-family="Arial">MILES</text><text x="225" y="165" text-anchor="middle" fill="#fff" font-size="42" font-weight="900" font-family="Arial,'Noto Sans KR',sans-serif">아시아나 방식 유지</text><text x="225" y="220" text-anchor="middle" fill="#ffd94a" font-size="38" font-weight="900" font-family="Arial,'Noto Sans KR',sans-serif">합병일부터 10년간</text><text x="225" y="265" text-anchor="middle" fill="#dbeaf7" font-size="25" font-family="Arial,'Noto Sans KR',sans-serif">기존 공제기준·소멸시효 적용</text></g><g transform="translate(670 225)"><rect width="450" height="310" rx="30" fill="#e85b64"/><rect x="40" y="38" width="130" height="78" rx="16" fill="#fff2f2"/><text x="105" y="88" text-anchor="middle" fill="#8d3c42" font-size="28" font-weight="800" font-family="Arial">MILES</text><text x="225" y="165" text-anchor="middle" fill="#fff" font-size="42" font-weight="900" font-family="Arial,'Noto Sans KR',sans-serif">대한항공으로 전환</text><text x="225" y="220" text-anchor="middle" fill="#fff7cf" font-size="31" font-weight="800" font-family="Arial,'Noto Sans KR',sans-serif">탑승 1:1 · 제휴 1:0.82</text><text x="225" y="265" text-anchor="middle" fill="#ffe6e8" font-size="25" font-family="Arial,'Noto Sans KR',sans-serif">별도 관리기간 중 신청 가능</text></g><circle cx="600" cy="380" r="58" fill="#fff" stroke="#7f9db7" stroke-width="4"/><text x="600" y="395" text-anchor="middle" fill="#315b7d" font-size="44" font-weight="900" font-family="Arial">↔</text><rect x="225" y="570" width="750" height="66" rx="22" fill="#fff" stroke="#cbd9e5" stroke-width="2"/><text x="600" y="612" text-anchor="middle" fill="#31495f" font-size="24" font-family="Arial,'Noto Sans KR',sans-serif">전환 신청 시 보유 아시아나 마일리지는 전량 전환됩니다.</text></svg>