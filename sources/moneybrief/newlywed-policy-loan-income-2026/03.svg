<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675"><rect width="1200" height="675" fill="#f8fafc"/><text x="70" y="75" font-family="Noto Sans CJK KR" font-size="24" font-weight="800" fill="#6b7280">03 · 소득구간별 사례</text><text x="70" y="140" font-family="Noto Sans CJK KR" font-size="48" font-weight="900" fill="#102a43">우리 부부도 해당될까?</text><text x="70" y="185" font-family="Noto Sans CJK KR" font-size="22" fill="#64748b">합산액보다 ‘각 배우자의 소득’이 중요해지는 구조</text><g transform="translate(90 540)"><rect x="0" y="-115" width="210" height="115" rx="16" fill="#dff3ea"/><rect x="245" y="-210" width="210" height="210" rx="16" fill="#dbeafe"/><rect x="490" y="-305" width="210" height="305" rx="16" fill="#fff0c2"/><rect x="735" y="-400" width="210" height="400" rx="16" fill="#fee2e2"/><text x="105" y="-62" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="30" font-weight="900">7,000만원</text><text x="105" y="-24" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="22" fill="#087f5b">가능성 높음</text><text x="350" y="-120" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="30" font-weight="900">1억원</text><text x="350" y="-78" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="22" fill="#1261a0">1인 기준 확인</text><text x="595" y="-205" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="30" font-weight="900">1억3천만원</text><text x="595" y="-163" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="22" fill="#9a6700">소득 분포가 핵심</text><text x="840" y="-300" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="30" font-weight="900">1억5천만원</text><text x="840" y="-258" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="22" fill="#b42318">추가요건 확인</text></g><text x="70" y="625" font-family="Noto Sans CJK KR" font-size="19" fill="#6b7280">※ 예시입니다. 실제 심사는 각 배우자 소득, 자산, 무주택, 주택가격 등 요건을 함께 확인합니다.</text></svg>