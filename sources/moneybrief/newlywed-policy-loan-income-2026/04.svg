<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675"><rect width="1200" height="675" fill="#f5f1e8"/><text x="65" y="72" font-family="Noto Sans CJK KR" font-size="24" font-weight="800" fill="#6b7280">04 · 제도 구분</text><text x="65" y="135" font-family="Noto Sans CJK KR" font-size="46" font-weight="900" fill="#102a43">‘신혼부부’라도 기준은 서로 다릅니다</text><circle cx="600" cy="360" r="105" fill="#123b62"/><text x="600" y="345" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="27" font-weight="900" fill="#fff">신혼부부</text><text x="600" y="385" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="27" font-weight="900" fill="#fff">주거지원</text><line x1="510" y1="300" x2="310" y2="245" stroke="#94a3b8" stroke-width="4"/><line x1="690" y1="300" x2="890" y2="245" stroke="#94a3b8" stroke-width="4"/><line x1="510" y1="420" x2="310" y2="500" stroke="#94a3b8" stroke-width="4"/><line x1="690" y1="420" x2="890" y2="500" stroke="#94a3b8" stroke-width="4"/><g font-family="Noto Sans CJK KR"><rect x="85" y="180" width="330" height="145" rx="22" fill="#dbeafe"/><text x="250" y="225" text-anchor="middle" font-size="27" font-weight="900" fill="#125a9c">신혼부부 특별공급</text><text x="250" y="270" text-anchor="middle" font-size="20" fill="#374151">도시근로자 월평균소득</text><text x="250" y="298" text-anchor="middle" font-size="20" fill="#374151">비율 기준 · 청약 제도</text><rect x="785" y="180" width="330" height="145" rx="22" fill="#dff3ea"/><text x="950" y="225" text-anchor="middle" font-size="27" font-weight="900" fill="#087f5b">버팀목 전세대출</text><text x="950" y="270" text-anchor="middle" font-size="20" fill="#374151">전세자금 · 주택도시기금</text><text x="950" y="298" text-anchor="middle" font-size="20" fill="#374151">개선안: 부부 중 1인 기준</text><rect x="85" y="455" width="330" height="145" rx="22" fill="#fff0c2"/><text x="250" y="500" text-anchor="middle" font-size="27" font-weight="900" fill="#9a6700">디딤돌 대출</text><text x="250" y="545" text-anchor="middle" font-size="20" fill="#374151">주택구입자금 · 주택도시기금</text><text x="250" y="573" text-anchor="middle" font-size="20" fill="#374151">개선안: 부부 중 1인 기준</text><rect x="785" y="455" width="330" height="145" rx="22" fill="#f5dfe8"/><text x="950" y="500" text-anchor="middle" font-size="27" font-weight="900" fill="#8f3d5c">신생아 특례대출</text><text x="950" y="545" text-anchor="middle" font-size="20" fill="#374151">출산가구 별도 요건</text><text x="950" y="573" text-anchor="middle" font-size="20" fill="#374151">일반 신혼부부 대출과 구분</text></g><text x="600" y="645" text-anchor="middle" font-family="Noto Sans CJK KR" font-size="19" fill="#6b7280">같은 단어를 써도 소득기준·자산기준·신청기관이 다릅니다.</text></svg>