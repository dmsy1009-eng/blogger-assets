<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675"><rect width="1200" height="675" fill="#fafafa"/><text x="65" y="70" fill="#202b3c" font-family="Noto Sans CJK KR" font-size="27" font-weight="700">05 · 세제혜택 전용계좌 체크</text><text x="65" y="130" fill="#202b3c" font-family="Noto Sans CJK KR" font-size="46" font-weight="800">나는 세제혜택 대상이 될 수 있을까?</text><rect x="80" y="200" width="420" height="82" rx="10" fill="#e6eef8"/><text x="110" y="250" fill="#234d7c" font-family="Noto Sans CJK KR" font-size="25" font-weight="700">① 19세 이상 또는 15세 이상 근로소득자?</text><path d="M290 282 L290 335" stroke="#4f6f91" stroke-width="5"/><polygon points="278,335 290,355 302,335" fill="#4f6f91"/><rect x="80" y="355" width="420" height="82" rx="10" fill="#e8f3ec"/><text x="110" y="405" fill="#2e6748" font-family="Noto Sans CJK KR" font-size="25" font-weight="700">② 직전 3개년 금융소득종합과세 이력 없음?</text><path d="M290 437 L290 490" stroke="#4f6f91" stroke-width="5"/><polygon points="278,490 290,510 302,490" fill="#4f6f91"/><rect x="80" y="510" width="420" height="82" rx="10" fill="#173f38"/><text x="128" y="562" fill="white" font-family="Noto Sans CJK KR" font-size="27" font-weight="800">전용계좌로 세제혜택 검토</text><rect x="650" y="220" width="460" height="270" rx="14" fill="#fff1e9"/><text x="700" y="275" fill="#8a4633" font-family="Noto Sans CJK KR" font-size="28" font-weight="800">요건을 못 맞추면?</text><text x="700" y="335" fill="#513b34" font-family="Noto Sans CJK KR" font-size="25">펀드 가입 자체가 모두 막히는 것은 아닙니다.</text><text x="700" y="385" fill="#513b34" font-family="Noto Sans CJK KR" font-size="25">세제혜택 없이 일반계좌 가입 가능</text><text x="700" y="435" fill="#8a4633" font-family="Noto Sans CJK KR" font-size="25" font-weight="700">일반계좌: 연간 3,000만원 한도</text><text x="65" y="640" fill="#6d7480" font-family="Noto Sans CJK KR" font-size="18">전용계좌 투자한도: 5년간 2억원 · 펀드가입액: 1인당 연간 1억원 · 자료: 금융위원회</text></svg>