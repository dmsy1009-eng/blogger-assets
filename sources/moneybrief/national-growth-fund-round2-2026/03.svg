<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675"><rect width="1200" height="675" fill="#ffffff"/><text x="60" y="75" fill="#172a46" font-family="Noto Sans CJK KR" font-size="27" font-weight="700">03 · 소득공제 계산</text><text x="60" y="140" fill="#172a46" font-family="Noto Sans CJK KR" font-size="47" font-weight="800">7,000만원 투자 시 최대 공제액은 1,800만원</text><rect x="60" y="205" width="1080" height="290" rx="8" fill="#f3f6fa"/><text x="95" y="260" fill="#66758a" font-family="Noto Sans CJK KR" font-size="22">투자금액</text><text x="340" y="260" fill="#66758a" font-family="Noto Sans CJK KR" font-size="22">공제구간</text><text x="720" y="260" fill="#66758a" font-family="Noto Sans CJK KR" font-size="22">최대 소득공제액</text><line x1="90" y1="285" x2="1100" y2="285" stroke="#c8d1dd"/><text x="95" y="335" fill="#172a46" font-family="Noto Sans CJK KR" font-size="28" font-weight="700">1,000만원</text><text x="340" y="335" fill="#172a46" font-family="Noto Sans CJK KR" font-size="26">3천만원 이하 × 40%</text><text x="720" y="335" fill="#1f5b9b" font-family="Noto Sans CJK KR" font-size="30" font-weight="800">400만원</text><text x="95" y="390" fill="#172a46" font-family="Noto Sans CJK KR" font-size="28" font-weight="700">3,000만원</text><text x="340" y="390" fill="#172a46" font-family="Noto Sans CJK KR" font-size="26">3천만원 이하 × 40%</text><text x="720" y="390" fill="#1f5b9b" font-family="Noto Sans CJK KR" font-size="30" font-weight="800">1,200만원</text><text x="95" y="445" fill="#172a46" font-family="Noto Sans CJK KR" font-size="28" font-weight="700">5,000만원</text><text x="340" y="445" fill="#172a46" font-family="Noto Sans CJK KR" font-size="26">1,200 + 400</text><text x="720" y="445" fill="#1f5b9b" font-family="Noto Sans CJK KR" font-size="30" font-weight="800">1,600만원</text><text x="95" y="490" fill="#172a46" font-family="Noto Sans CJK KR" font-size="28" font-weight="700">7,000만원</text><text x="340" y="490" fill="#172a46" font-family="Noto Sans CJK KR" font-size="26">1,200 + 400 + 200</text><text x="720" y="490" fill="#c84d43" font-family="Noto Sans CJK KR" font-size="34" font-weight="900">1,800만원</text><rect x="60" y="535" width="1080" height="80" rx="8" fill="#fff1d7"/><text x="95" y="585" fill="#8a5411" font-family="Noto Sans CJK KR" font-size="27" font-weight="800">주의: 소득공제액 ≠ 실제 세금 환급액</text><text x="60" y="650" fill="#687487" font-family="Noto Sans CJK KR" font-size="18">자료: 금융위원회 · 실제 절세효과는 개인별 과세표준과 세율에 따라 달라짐</text></svg>