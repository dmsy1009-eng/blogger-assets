<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675"><rect width="1200" height="675" fill="#f4efe7"/><text x="65" y="72" fill="#292d32" font-family="Noto Sans CJK KR" font-size="27" font-weight="700">06 · 가입 전 마지막 체크</text><text x="65" y="135" fill="#292d32" font-family="Noto Sans CJK KR" font-size="47" font-weight="800">세제혜택보다 먼저 볼 것은 ‘5년’과 ‘손실 가능성’</text><rect x="70" y="200" width="500" height="355" rx="12" fill="#edf5ef"/><text x="110" y="255" fill="#276044" font-family="Noto Sans CJK KR" font-size="29" font-weight="800">검토할 만한 경우</text><text x="110" y="320" fill="#263b31" font-family="Noto Sans CJK KR" font-size="25">✓ 5년 동안 쓰지 않을 여유자금</text><text x="110" y="375" fill="#263b31" font-family="Noto Sans CJK KR" font-size="25">✓ 소득공제를 활용할 수 있음</text><text x="110" y="430" fill="#263b31" font-family="Noto Sans CJK KR" font-size="25">✓ 원금손실 가능성을 감내할 수 있음</text><text x="110" y="485" fill="#263b31" font-family="Noto Sans CJK KR" font-size="25">✓ 장기 비상장·메자닌 투자를 이해함</text><rect x="630" y="200" width="500" height="355" rx="12" fill="#faece9"/><text x="670" y="255" fill="#a23f35" font-family="Noto Sans CJK KR" font-size="29" font-weight="800">신중해야 하는 경우</text><text x="670" y="320" fill="#4c3330" font-family="Noto Sans CJK KR" font-size="25">! 1~3년 안에 목돈 사용 예정</text><text x="670" y="375" fill="#4c3330" font-family="Noto Sans CJK KR" font-size="25">! 원금보장이 꼭 필요함</text><text x="670" y="430" fill="#4c3330" font-family="Noto Sans CJK KR" font-size="25">! 비상금까지 투자해야 함</text><text x="670" y="485" fill="#4c3330" font-family="Noto Sans CJK KR" font-size="25">! 세제혜택만 보고 가입하려 함</text><text x="65" y="615" fill="#6c6257" font-family="Noto Sans CJK KR" font-size="21">머니브리프 판단 기준: “좋은 세제혜택”과 “나에게 맞는 투자”는 같은 말이 아닙니다.</text><text x="65" y="650" fill="#7c746b" font-family="Noto Sans CJK KR" font-size="17">자료: 금융위원회 · 투자 전 판매사 상품설명서 및 최신 조건 확인</text></svg>