<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675"><rect width="1200" height="675" fill="#ffffff"/><text x="60" y="72" fill="#172a46" font-family="Noto Sans CJK KR" font-size="27" font-weight="700">06 · 추석 전 금융 체크리스트</text><text x="60" y="140" fill="#172a46" font-family="Noto Sans CJK KR" font-size="49" font-weight="800">연휴 전에 이것만 확인하면 됩니다</text><rect x="60" y="195" width="1080" height="345" rx="12" fill="#f3f6fa"/><circle cx="105" cy="255" r="23" fill="#1f5b9b"/><text x="98" y="264" fill="white" font-family="Noto Sans CJK KR" font-size="23" font-weight="800">1</text><text x="155" y="265" fill="#172a46" font-family="Noto Sans CJK KR" font-size="28" font-weight="700">대출 만기일이 9월 24~27일인지 확인</text><circle cx="105" cy="315" r="23" fill="#1f5b9b"/><text x="98" y="324" fill="white" font-family="Noto Sans CJK KR" font-size="23" font-weight="800">2</text><text x="155" y="325" fill="#172a46" font-family="Noto Sans CJK KR" font-size="28" font-weight="700">9월 28일 카드 결제계좌 잔액 확인</text><circle cx="105" cy="375" r="23" fill="#1f5b9b"/><text x="98" y="384" fill="white" font-family="Noto Sans CJK KR" font-size="23" font-weight="800">3</text><text x="155" y="385" fill="#172a46" font-family="Noto Sans CJK KR" font-size="28" font-weight="700">보험료·통신료·공과금 자동이체일 확인</text><circle cx="105" cy="435" r="23" fill="#1f5b9b"/><text x="98" y="444" fill="white" font-family="Noto Sans CJK KR" font-size="23" font-weight="800">4</text><text x="155" y="445" fill="#172a46" font-family="Noto Sans CJK KR" font-size="28" font-weight="700">주택연금·현금수요·큰 금액 이체 사전 준비</text><circle cx="105" cy="495" r="23" fill="#1f5b9b"/><text x="98" y="504" fill="white" font-family="Noto Sans CJK KR" font-size="23" font-weight="800">5</text><text x="155" y="505" fill="#172a46" font-family="Noto Sans CJK KR" font-size="28" font-weight="700">해외주식·펀드·보험금은 회사별 일정 별도 확인</text><rect x="60" y="570" width="1080" height="55" rx="10" fill="#fff1d7"/><text x="95" y="606" fill="#8a5411" font-family="Noto Sans CJK KR" font-size="24" font-weight="800">핵심: 9월 28일에 출금이 몰릴 수 있으니 계좌잔액을 여유 있게 준비하세요</text><text x="60" y="650" fill="#687487" font-family="Noto Sans CJK KR" font-size="18">자료: 금융위원회, 2026.09.14</text></svg>