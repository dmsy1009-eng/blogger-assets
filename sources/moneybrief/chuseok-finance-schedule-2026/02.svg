<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675"><rect width="1200" height="675" fill="#ffffff"/><text x="60" y="72" fill="#172a46" font-family="Noto Sans CJK KR" font-size="27" font-weight="700">02 · 날짜별 핵심 일정</text><text x="60" y="140" fill="#172a46" font-family="Noto Sans CJK KR" font-size="50" font-weight="800">추석 연휴 금융일정 한눈에 보기</text><text x="60" y="185" fill="#66758a" font-family="Noto Sans CJK KR" font-size="25">9월 23일 → 연휴 → 9월 28일 순서만 기억하면 됩니다</text><line x1="145" y1="335" x2="1055" y2="335" stroke="#c8d1dd" stroke-width="8"/><circle cx="190" cy="335" r="26" fill="#1f5b9b"/><circle cx="600" cy="335" r="26" fill="#f0c85a"/><circle cx="1010" cy="335" r="26" fill="#1f5b9b"/><rect x="70" y="235" width="240" height="235" rx="12" fill="#f3f6fa"/><text x="110" y="285" fill="#1f5b9b" font-family="Noto Sans CJK KR" font-size="30" font-weight="800">9.23(수)</text><text x="110" y="380" fill="#172a46" font-family="Noto Sans CJK KR" font-size="31" font-weight="800">주택연금</text><text x="110" y="425" fill="#172a46" font-family="Noto Sans CJK KR" font-size="31" font-weight="800">선지급</text><rect x="480" y="235" width="240" height="235" rx="12" fill="#fff7df"/><text x="520" y="285" fill="#8a5411" font-family="Noto Sans CJK KR" font-size="30" font-weight="800">9.24~9.27</text><text x="520" y="380" fill="#172a46" font-family="Noto Sans CJK KR" font-size="31" font-weight="800">추석 연휴</text><text x="520" y="425" fill="#66758a" font-family="Noto Sans CJK KR" font-size="23">일반 금융거래 제한</text><rect x="890" y="235" width="240" height="235" rx="12" fill="#f3f6fa"/><text x="930" y="285" fill="#1f5b9b" font-family="Noto Sans CJK KR" font-size="30" font-weight="800">9.28(월)</text><text x="930" y="370" fill="#172a46" font-family="Noto Sans CJK KR" font-size="27" font-weight="800">대출·카드·</text><text x="930" y="410" fill="#172a46" font-family="Noto Sans CJK KR" font-size="27" font-weight="800">자동납부 처리</text><rect x="60" y="520" width="1080" height="90" rx="10" fill="#eef4fb"/>