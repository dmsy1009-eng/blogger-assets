<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675"><rect width="1200" height="675" fill="#ffffff"/><text x="60" y="72" fill="#172a46" font-family="Noto Sans CJK KR" font-size="27" font-weight="700">04 · 연휴 전에 미리 준비</text><text x="60" y="140" fill="#172a46" font-family="Noto Sans CJK KR" font-size="49" font-weight="800">큰 거래·현금수요가 있다면 먼저 체크</text><rect x="60" y="205" width="320" height="300" rx="12" fill="#f3f6fa"/><text x="95" y="265" fill="#1f5b9b" font-family="Noto Sans CJK KR" font-size="28" font-weight="800">주택연금</text><text x="95" y="335" fill="#172a46" font-family="Noto Sans CJK KR" font-size="42" font-weight="900">9.23 선지급</text><text x="95" y="390" fill="#66758a" font-family="Noto Sans CJK KR" font-size="23">연휴 중 지급일 도래 고객</text><text x="95" y="430" fill="#66758a" font-family="Noto Sans CJK KR" font-size="23">연휴 전에 미리 수령</text><rect x="440" y="205" width="320" height="300" rx="12" fill="#f3f6fa"/><text x="475" y="265" fill="#1f5b9b" font-family="Noto Sans CJK KR" font-size="28" font-weight="800">큰 금액 이체</text><text x="475" y="335" fill="#172a46" font-family="Noto Sans CJK KR" font-size="39" font-weight="900">이체한도 확인</text><text x="475" y="390" fill="#66758a" font-family="Noto Sans CJK KR" font-size="23">부동산 잔금·전세금 등</text><text x="475" y="430" fill="#66758a" font-family="Noto Sans CJK KR" font-size="23">필요하면 사전 상향</text><rect x="820" y="205" width="320" height="300" rx="12" fill="#f3f6fa"/><text x="855" y="265" fill="#1f5b9b" font-family="Noto Sans CJK KR" font-size="28" font-weight="800">긴급 금융거래</text><text x="855" y="335" fill="#172a46" font-family="Noto Sans CJK KR" font-size="39" font-weight="900">이동점포 11개</text><text x="855" y="390" fill="#66758a" font-family="Noto Sans CJK KR" font-size="23">입·출금·신권교환</text><text x="855" y="430" fill="#66758a" font-family="Noto Sans CJK KR" font-size="23">탄력점포도 11개 운영</text><rect x="60" y="545" width="1080" height="70" rx="10" fill="#eef4fb"/><text x="95" y="589" fill="#1f5b9b" font-family="Noto Sans CJK